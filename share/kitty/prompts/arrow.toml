"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000
format = """
[▸](bold #7aa2f7) $directory$git_branch$git_status
$character"""
[directory]
style = "bold #7dcfff"
truncation_length = 4
format = "[$path]($style)"
[git_branch]
symbol = " "
format = "[  $symbol$branch](#bb9af7)"
[git_status]
format = "[ $all_status$ahead_behind](#f7768e)"
[character]
success_symbol = "[▸](bold #9ece6a)"
error_symbol = "[▸](bold #f7768e)"
