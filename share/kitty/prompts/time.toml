"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000
format = "$directory$git_branch$git_status$fill$time$line_break$character"
[fill]
symbol = " "
[directory]
style = "bold cyan"
truncation_length = 3
format = "[$path ]($style)"
[git_branch]
symbol = " "
format = "[$symbol$branch ](purple)"
[git_status]
format = "[$all_status$ahead_behind](red)"
[time]
disabled = false
time_format = "%H:%M"
format = "[  $time](dim white)"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
